[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capsim-sim"
version = "1.0.0"
description = "CAPSM Stage-1 — Cognitive Adaptive Power System Management, offline Python validation on real OPSD data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mahmoud Kiasari", email = "mahmoud.kiasari@dal.ca" },
]
keywords = ["power systems", "reinforcement learning", "CNN-LSTM", "quantum-inspired RL", "OPSD", "FACTS", "V2G", "smart grid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Power Systems",
    "Intended Audience :: Science/Research",
]

# Runtime dependencies — pinned in requirements.txt for reproducibility.
dependencies = [
    "PYPOWER>=5.1.21",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "requests>=2.28",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]

[project.urls]
Homepage = "https://github.com/mtk1793/PhD-Thesis"
Repository = "https://github.com/mtk1793/PhD-Thesis"
Documentation = "https://github.com/mtk1793/PhD-Thesis/blob/main/capsim_sim/README.md"

[project.scripts]
capsim = "capsm.cli:main"

[tool.setuptools]
packages = ["capsm", "capsm.agents", "capsm.data", "capsm.grid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_phase*.py"]
addopts = "-v"
